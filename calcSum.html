<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1부터 n까지 숫자를 더하는 함수</title>
</head>

<body>
  <script>
    var num = prompt("얼마까지 더할까요?");
    if (num !== null) {
      calcSum(parseInt(num));
    }

    function calcSum(n) {
      var sum = 0;

      for (let i = 0; i < n + 1; i++) {
        sum += i;
      }
      document.write("1부터 " + n + "까지 더하면 " + sum);
    }
  </script>
</body>

</html>
