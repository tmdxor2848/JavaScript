<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배열을 만들고 요소 표시하기</title>
</head>

<body>
  <h1>배열의 각 요소</h1>
  <script>
    var num = ["one", "two", "three", "four"];

    for (i = 0; i < num.length; i++) {
      document.write("<p>" + num[i] + "</p>");
    }
  </script>
</body>

</html>
