<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>repeat-2</title>
</head>

<body>
  <script>
    var i;
    var sum = 0;

    for (i = 0; i < 1001; i++) {
      sum += i;
    }
    document.write("1부터 1000까지 더하면 " + sum);
  </script>
</body>

</html>
