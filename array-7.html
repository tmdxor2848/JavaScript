<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>splice() 매서드의 인수가 1개인 경우 요소 삭제하기</title>
</head>

<body>
  <script>
    var nums = [1, 2, 3, 4, 5];
    var chars = ["a", "b", "c", "d"];

    var numsChars = nums.concat(chars);
    var charsNums = chars.concat(nums);

    var newNums = nums.splice(2);

    document.write("반환된 배열 : ", newNums, "<br>");
    document.write("반환된 배열 : ", nums);

  </script>
</body>

</html>
