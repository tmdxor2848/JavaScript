<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호이스팅이 없는 let 변수</title>
</head>

<body>
  <!-- 자바스크립트에서 호이스팅(Hoisting)이란, 
   변수 및 함수 선언이 실제 코드 작성 위치와 관계없이 해당 스코프의 최상단으로 끌어올려진
    것처럼 동작하는 현상을 말합니다. 물리적으로 코드가 이동하는 것은 아니며,
     실행 전 엔진이 변수와 함수를 미리 메모리에 등록하기 때문에 발생합니다 -->
  <script>
    var x = 10;
    function displayNum() {
      console.log("x is " + x);
      console.log("y is " + y); // 선언되지 않은 y 사용
      let y = 20; // y 변수 선언
    }
    displayNum();
  </script>
</body>

</html>
