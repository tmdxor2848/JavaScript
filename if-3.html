<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>if-3</title>
</head>

<body>

  <h2>조건 연산자</h2>
  <script>
    var num = prompt("숫자를 입력하세요.")

    if (num !== null)
      (num % 3 === 0) ? alert("3의 배수입니다.") : alert("3의 배수가 아닙니다.")
    else
      alert("입력이 취소됐습니다.")
  </script>
</body>

</html>
