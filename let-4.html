<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재선언할 수 없는 let 변수</title>
</head>

<body>
  <script>
    function calcSum(n) {
      let sum = 0;
      for (let i = 1; i < n + 1; i++) {
        sum += i;
      }
      let sum;
      console.log(sum);
    }
    calcSum(10);
  </script>
  <!-- let 예약어는 같은 변수 이름을 중복해서 사용할 수 없다. -->
</body>

</html>
