<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>array 배열</title>
</head>

<body>
  <script>
    var num = new Array(); // 배열의 크기를 지정하지 않음
    var num = new Array(4); // 배열의 크기를 지정함

    var arr = ["one", "two", "three", "four"];  // 배열 선언 
    var arr = Array("one", "two", "three", "four"); // Array 객체를 사용한 배열 선언
  </script>
</body>

</html>
