<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항</title>
  <style>
    div {
      padding: 10px;
      border: 2px solid skyblue;
      border-radius: 10px;
    }

    li {
      list-style: none;
    }

    button {
      display: flex;
      margin-top: 30px;
      float: right;
    }
  </style>
</head>

<body>
  <div>
    <h1>공지사항</h1>
    <ul>
      <li>항목1</li>
      <li>항목2</li>
      <li>항목3</li>
      <li>항목4</li>
    </ul>
  </div>
  <button>닫기</button>
</body>

</html>
