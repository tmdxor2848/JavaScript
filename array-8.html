<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>splice() 매서드의 인수가 2개인 경우 요소 삭제하기</title>
</head>

<body>
  <script>
    var nums = [1, 2, 3, 4, 5];
    var chars = ["html", "css", "web", "jquery"];

    var numsChars = nums.concat(chars);
    var charsNums = chars.concat(nums);

    var newChars = chars.splice(2, 1);

    document.write("반환된 배열 : ", newChars, "<br>");
    document.write("반환된 배열 : ", chars);

  </script>
</body>

</html>
