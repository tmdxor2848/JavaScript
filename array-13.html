<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>slice() 매서드의 인수가 1개인 경우 요소 꺼내기</title>
</head>

<body>
  <script>
    var nums = [1, 2, 3, 4, 5];
    var chars = ["html", "css", "web", "jquery"];
    var colors = ["red", "green", "blue", "white", "black"];

    var numsChars = nums.concat(chars);
    var charsNums = chars.concat(nums);

    var newColors = colors.slice(2); // 인덱스 값 2부터 마지막 요소 까지 꺼내기

    document.write(newColors);



  </script>
</body>

</html>
