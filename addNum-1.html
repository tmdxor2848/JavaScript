<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매개변수를 사용한 함수 선언하고 호출하기</title>
</head>

<body>
  <script>
    function addNum(num1, num2) {
      var sum = num1 + num2;
      return sum;
    }
    var result = addNum(2, 3);
    document.write("두 수를 더한 값 : " + result);
  </script>
</body>

</html>
