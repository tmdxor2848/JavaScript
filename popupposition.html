<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>popup position</title>
</head>

<body>
  <p>창 위치 지정하기.</p>
  <p>왼쪽에서 100px, 위에서 200px 떨어진 위치에 <br> 팝업 창이 표시 됩니다.</p>
  <script>
    window.open("notice.html", "pop", "width=500, height=400, left=100, top=200");
    // 팝업창에 이름이 생겨 지정한 창에만 내용이 나타남.
  </script>
</body>

</html>
