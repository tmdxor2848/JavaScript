<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매개변수의 기본값 지정</title>
</head>

<body>
  <script>
    function multiple(a, b = 5, c = 10) {
      return a * b + c;
    }
    a = multiple(5, 10, 20);
    b = multiple(10, 20);
    c = multiple(30);
    console.log(a, b, c
    );
  </script>
</body>

</html>
