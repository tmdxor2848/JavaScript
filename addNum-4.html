<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매개변수가 있는 즉시 실행 함수 만들기</title>
</head>

<body>
  <script>
    (function (a, b) {
      sum = a + b;
    }(100, 200));
    document.write(sum);
  </script>
</body>

</html>
