<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>and연산자</title>
</head>

<body>
  <script>
    var num1 = prompt("50 미만인 숫자를 입력하세요.");
    var num2 = prompt("50 미만인 숫자를 입력하세요.");

    if (num1 < 50 && num2 < 50)
      alert("숫자 2개 모두 50 미만입니다.");
    else
      alert("조건에 맞지 않는 숫자가 있습니다.");
  </script>
</body>
