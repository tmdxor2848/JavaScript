<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>splice() 매서드의 인수가 3개인 경우 요소 삭제.추가하기</title>
</head>

<body>
  <script>
    var nums = [1, 2, 3, 4, 5];
    var chars = ["html", "css", "web", "jquery"];
    var colors = ["red", "green", "blue", "white", "black"];

    var numsChars = nums.concat(chars);
    var charsNums = chars.concat(nums);

    var newChars = chars.slice(2, 1, "js"); // 인덱스 값 2부터 4 직전 요소 까지 꺼내기

    document.write(chars);
    document.write("<br>");
    document.write(newChars);


  </script>
</body>

</html>
