<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>age-program</title>
</head>

<body>
  <script>
    var y = 2026;
    var birthY;
    var age;

    birthY = prompt("태어난 연도를 입력하세요. (YYYY)", "")
    age = y - birthY + 1;
    document.write(y + "년 현재<br>");
    document.write(birthY + "년에 태어난 사람의 나이는 " + age + "세 입니다.")
  </script>
</body>

</html>
