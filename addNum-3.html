<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>익명 함수 실행</title>
</head>

<body>
  <script>
    var sum = function (a, b) { // 익명 함수 선언후 변수 sum에 할당
      return a + b;
    }
    document.write(sum(10, 20));  // 익명 함수 실행
  </script>
</body>

</html>
